name: Instalação e Incus real
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxe do bootstrap
        run: sh -n install.sh
      - name: Rejeitar namespace sem IDs delegados antes de instalar
        run: |
          probe_dir=$(mktemp -d /tmp/incus-panel-preflight.XXXXXX)
          trap 'rm -rf -- "$probe_dir"' EXIT
          chmod 755 "$probe_dir"
          install -d -m 755 "$probe_dir/deploy" "$probe_dir/incus_panel"
          install -m 644 deploy/preflight.py "$probe_dir/deploy/"
          install -m 644 incus_panel/__init__.py incus_panel/memory.py "$probe_dir/incus_panel/"
          set +e
          sudo unshare --user --map-root-user python3 "$probe_dir/deploy/preflight.py" > /tmp/preflight.log 2>&1
          status=$?
          set -e
          cat /tmp/preflight.log
          test "$status" -ne 0
          grep -q 'Mapeamento UID incompatível' /tmp/preflight.log
          test ! -e /etc/incus-panel/config.local.json
      - name: Instalar tudo pelo bootstrap, preparando faixas e verificando container real
        run: sudo sh install.sh
      - name: Confirmar idempotência da preparação automática
        run: |
          sudo sha256sum /etc/subuid /etc/subgid > /tmp/subids.sha256
          sudo python3 deploy/preflight.py --prepare-idmaps --restart-incus
          sudo sha256sum -c /tmp/subids.sha256
      - name: Reinstalação preservando configurações e credenciais
        run: |
          sudo sha256sum /etc/incus-panel/config.local.json > /tmp/config.sha256
          sudo python3 deploy/install.py
          sudo sha256sum -c /tmp/config.sha256
      - name: Testes Linux (incluindo socket Unix e instalador)
        run: python3 -m unittest discover -s tests -v
      - name: Snapshot e reversão de conteúdo em Incus real
        run: sudo python3 -m incus_panel.verify --config /etc/incus-panel/config.local.json --snapshots
      - name: Diagnóstico de falhas
        if: failure()
        run: |
          sudo journalctl -u incus.service -u incus-panel.service --no-pager -n 100
          if command -v incus >/dev/null 2>&1; then sudo incus list; fi
